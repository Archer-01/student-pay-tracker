<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The status bar matches the page, light or dark; lib/theme.tsx keeps it in step. -->
    <meta name="theme-color" content="#f3f6f5" />
    <!-- Installed from the home screen, Ardoise opens as an app: no address bar, no tabs. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ardoise" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Ardoise</title>
    <script>
      // Apply the saved/system theme before first paint to avoid a flash of the wrong theme.
      try {
        // No stored choice means "follow the device" (see lib/theme.tsx).
        var t = localStorage.getItem("ardoise.theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#111615");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
