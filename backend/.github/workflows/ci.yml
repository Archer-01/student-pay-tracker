name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint
        run: just lint

      - name: Test
        run: |
          uv run pytest
          code=$?
          # pytest exits 5 when zero tests are collected; treat as pass until Sprint 1 lands real tests
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then exit "$code"; fi

      - name: Check migrations apply cleanly
        run: just migrate
