services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "sqlite:////data/app.db"
    volumes:
      - tracker-data:/data
    healthcheck:
      # No curl in the slim image; use python + stdlib to hit the real DB health check.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  tracker-data:
